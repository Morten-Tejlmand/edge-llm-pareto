[project]
name = "edge-llm-pareto"
version = "0.1.0"
description = "Pareto fronts for edge LLM serving: quantization x concurrency on a memory-constrained GPU"
requires-python = ">=3.12,<3.13"
dependencies = [
    "openai>=1.40",
    "huggingface-hub>=0.26",
    "nvidia-ml-py>=12.560",
    "pyyaml>=6.0",
    "pandas>=2.2",
    "matplotlib>=3.9",
    "sacrebleu>=2.5,<3",
    "tokenizers>=0.20",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/edge_llm_pareto"]

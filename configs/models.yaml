# Quantization ladder for the pareto sweep.
#
# `linear_bits` is the effective bit-width of the transformer-block linears only;
# embeddings are tracked separately because on a ~2B model they are ~18% of
# parameters and most quantizers leave them near full precision. The budget
# calculator uses these to predict fit before paying vLLM's ~5min startup cost.
#
# All repo ids below were verified to exist on Hugging Face.

defaults:
  kv_dtype_bytes: 2       # fp16 KV; vLLM fp8 KV is a separate axis to sweep later
  embedding_bits: 16

# GB10 / DGX Spark, 128 GB unified memory. Keep a modest initial sweep;
# increase concurrency or context explicitly after validating the baseline.
concurrency: [1, 2, 4, 8, 16, 32]

models:

  # Small-model baseline, with full precision and quantized variants.
  qwen3-1.7b:
    shape_from: unsloth/Qwen3-1.7B
    params: 1720000000
    engine_rungs:

      vllm:
        rungs:
          - rung: bf16
            repo: unsloth/Qwen3-1.7B
            linear_bits: 16
            quantization: null
          - rung: fp8-w8a8
            repo: unsloth/Qwen3-1.7B-FP8
            linear_bits: 8
            quantization: compressed-tensors
          - rung: w4a16
            repo: RedHatAI/Qwen3-1.7B-quantized.w4a16
            linear_bits: 4
            quantization: compressed-tensors
          - rung: gptq-int4
            repo: JunHowie/Qwen3-1.7B-GPTQ-Int4
            linear_bits: 4
            quantization: gptq_marlin
          - rung: awq-int4
            repo: Orion-zhen/Qwen3-1.7B-AWQ
            linear_bits: 4
            quantization: awq_marlin
          # bnb rungs need the plugin extra: `uv sync --extra bnb`
          - rung: bnb-4bit
            repo: unsloth/Qwen3-1.7B-bnb-4bit
            linear_bits: 4
            quantization: bitsandbytes
          - rung: bnb-4bit-dyn
            repo: unsloth/Qwen3-1.7B-unsloth-bnb-4bit
            linear_bits: 4.5
            quantization: bitsandbytes
            note: unsloth dynamic -- selectively keeps sensitive layers higher

      # Unsloth's dynamic (UD-*) quants are GGUF-native. This is where the
      # state-of-the-art low-bit work actually lives; vLLM cannot serve these
      # at speed, which is the central cross-engine tradeoff of this project.
      llama_cpp:
        repo: unsloth/Qwen3-1.7B-GGUF
        rungs:
          - {rung: gguf-bf16,       file: Qwen3-1.7B-BF16.gguf,       linear_bits: 16}
          - {rung: gguf-q8_0,       file: Qwen3-1.7B-Q8_0.gguf,       linear_bits: 8}
          - {rung: gguf-ud-q4_k_xl, file: Qwen3-1.7B-UD-Q4_K_XL.gguf, linear_bits: 4.5}
          - {rung: gguf-q4_k_m,     file: Qwen3-1.7B-Q4_K_M.gguf,     linear_bits: 4.5}
          - {rung: gguf-ud-q3_k_xl, file: Qwen3-1.7B-UD-Q3_K_XL.gguf, linear_bits: 3.5}
          - {rung: gguf-ud-q2_k_xl, file: Qwen3-1.7B-UD-Q2_K_XL.gguf, linear_bits: 2.5}
          - {rung: gguf-ud-iq1_m,   file: Qwen3-1.7B-UD-IQ1_M.gguf,   linear_bits: 1.75}

  # Larger baseline; BF16 fits the target GB10 memory capacity.
  qwen3-4b-2507:
    shape_from: unsloth/Qwen3-4B-Instruct-2507
    params: 4020000000
    engine_rungs:

      vllm:
        rungs:
          - rung: bf16
            repo: unsloth/Qwen3-4B-Instruct-2507
            linear_bits: 16
            quantization: null
          - rung: fp8-w8a8
            repo: unsloth/Qwen3-4B-Instruct-2507-FP8
            linear_bits: 8
            quantization: compressed-tensors
          - rung: awq-int4
            repo: cyankiwi/Qwen3-4B-Instruct-2507-AWQ-4bit
            linear_bits: 4
            quantization: awq_marlin
          - rung: bnb-4bit-dyn
            repo: unsloth/Qwen3-4B-Instruct-2507-unsloth-bnb-4bit
            linear_bits: 4.5
            quantization: bitsandbytes

      llama_cpp:
        repo: unsloth/Qwen3-4B-Instruct-2507-GGUF
        rungs:
          - {rung: gguf-ud-q4_k_xl, file: Qwen3-4B-Instruct-2507-UD-Q4_K_XL.gguf, linear_bits: 4.5}
          - {rung: gguf-ud-q2_k_xl, file: Qwen3-4B-Instruct-2507-UD-Q2_K_XL.gguf, linear_bits: 2.5}
